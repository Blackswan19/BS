<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8" /> <meta name="viewport" content="width=device-width, initial-scale=1.0" /> <title>Black Swan | BsDevTol</title> <link rel="icon" type="image/x-icon" href="https://i.ibb.co/27GXWVgg/BS.png"> <style> :root { --bg: #000000; --panel: #0a0a0a; --surface: #111111; --border: #222222; --border-light: #2a2a2a; --text: #f0f0f0; --muted: #888888; --blue: #2b6cc2; --blue-hover: #1e5aad; --blue-dim: rgba(43, 108, 194, 0.15); --font-mono: "SF Mono", "Fira Code", "Cascadia Code", Consolas, monospace; --font-sans: system-ui, -apple-system, "Segoe UI", sans-serif; } * { -webkit-tap-highlight-color: transparent; } body { -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; } * { box-sizing: border-box; margin: 0; padding: 0; } html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--font-sans); } /* ===== Header ===== */ .header { display: flex; align-items: center; justify-content: space-between; padding: 0 16px; height: 48px; background: var(--panel); border-bottom: 1px solid var(--border); flex-shrink: 0; } .logo { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; letter-spacing: -0.02em; color: var(--text); } .logo span { color: var(--blue); } .header-actions { display: flex; align-items: center; gap: 6px; } .btn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 6px; font-size: 13px; font-weight: 500; cursor: pointer; transition: background 0.12s, border-color 0.12s; font-family: inherit; } .btn:hover { background: #1a1a1a; border-color: #333; } .btn:active { transform: scale(0.97); } .btn-blue { background: var(--blue); border-color: var(--blue); color: #fff; } .btn-blue:hover { background: var(--blue-hover); border-color: var(--blue-hover); } .btn-ghost { background: transparent; border-color: transparent; color: var(--muted); } .btn-ghost:hover { color: var(--text); background: var(--surface); } .btn svg { width: 14px; height: 14px; flex-shrink: 0; } /* ===== Layout ===== */ .main { display: flex; height: calc(100% - 48px); overflow: hidden; } .panel { display: flex; flex-direction: column; min-width: 0; background: var(--panel); } .panel-editor { flex: 1; border-right: 1px solid var(--border); } .panel-preview { flex: 1; position: relative; } .panel-bar { display: flex; align-items: center; justify-content: space-between; padding: 0 12px; height: 36px; background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0; } .panel-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); } .status { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 5px; } .status-dot { width: 6px; height: 6px; border-radius: 50%; background: #2b6cc2; } /* ===== Toolbar ===== */ .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 3px; padding: 6px 8px; background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0; } .tb-btn { display: inline-flex; align-items: center; justify-content: center; gap: 4px; min-width: 30px; height: 28px; padding: 0 8px; border: 1px solid transparent; background: transparent; color: var(--text); border-radius: 5px; font-size: 12px; font-weight: 600; cursor: pointer; transition: background 0.1s, border-color 0.1s; font-family: inherit; white-space: nowrap; } .tb-btn:hover { background: var(--bg); border-color: var(--border-light); } .tb-btn:active { background: var(--blue-dim); } .tb-btn.bold { font-weight: 800; } .tb-btn.italic { font-style: italic; } .tb-btn.underline { text-decoration: underline; } .tb-sep { width: 1px; height: 18px; background: var(--border); margin: 0 3px; } /* ===== Editor ===== */ #editor { flex: 1; width: 100%; border: none; outline: none; resize: none; background: var(--bg); color: #d8d8d8; font-family: var(--font-mono); font-size: 13px; line-height: 1.55; padding: 12px 14px; tab-size: 2; white-space: pre; overflow: auto; } #editor::placeholder { color: #444; } /* ===== Preview ===== */ #preview-frame { flex: 1; width: 100%; height: 100%; border: none; background: #fff; } .preview-empty { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: #999; background: #fff; pointer-events: none; opacity: 0; transition: opacity 0.2s; font-size: 14px; } .preview-empty.visible { opacity: 1; } /* ===== Resizer ===== */ .resizer { width: 4px; background: var(--border); cursor: col-resize; flex-shrink: 0; transition: background 0.12s; } .resizer:hover, .resizer.dragging { background: var(--blue); } /* ===== Fullscreen ===== */ .fs-overlay { position: fixed; inset: 0; z-index: 1000; background: #fff; display: none; flex-direction: column; } .fs-overlay.active { display: flex; } .fs-bar { display: flex; align-items: center; justify-content: space-between; padding: 0 16px; height: 44px; background: var(--panel); border-bottom: 1px solid var(--border); flex-shrink: 0; } .fs-bar .logo { font-size: 14px; } #fs-frame { flex: 1; width: 100%; border: none; background: #fff; } /* ===== Modal ===== */ .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 2000; display: none; align-items: center; justify-content: center; padding: 16px; } .modal-backdrop.open { display: flex; } .modal { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; width: 100%; max-width: 380px; padding: 18px; } .modal h3 { font-size: 15px; font-weight: 600; margin-bottom: 4px; } .modal p { font-size: 12px; color: var(--muted); margin-bottom: 12px; } .modal input { width: 100%; height: 36px; padding: 0 10px; border: 1px solid var(--border); background: var(--bg); color: var(--text); border-radius: 6px; font-size: 13px; font-family: inherit; outline: none; margin-bottom: 14px; } .modal input:focus { border-color: var(--blue); } .modal-actions { display: flex; justify-content: flex-end; gap: 6px; } @media (max-width: 700px) { .main { flex-direction: column; } .panel-editor { flex: 0 0 48%; border-right: none; border-bottom: 1px solid var(--border); } .resizer { width: 100%; height: 4px; cursor: row-resize; } .tb-btn { padding: 0 6px; font-size: 11px; height: 26px; } } </style> </head> <body> <header class="header"> <div class="logo"> Bs<span>DevTol</span> </div> <div class="header-actions"> <button class="btn btn-ghost" id="btn-reset" title="Reset">Reset</button> <button class="btn" id="btn-copy" title="Copy code with watermark"> <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Copy </button> <button class="btn btn-blue" id="btn-download" title="Download HTML"> <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Download </button> <button class="btn btn-blue" id="btn-fullscreen" title="Full screen preview"> Full Screen </button> </div> </header> <div class="main" id="main"> <div class="panel panel-editor" id="panel-editor"> <div class="panel-bar"> <span class="panel-title">Code</span> <div class="status"> <span class="status-dot"></span> <span id="status-text">Ready</span> </div> </div> <div class="toolbar" id="toolbar"> <button class="tb-btn bold" data-action="bold" title="Bold">B</button> <button class="tb-btn italic" data-action="italic" title="Italic">I</button> <button class="tb-btn underline" data-action="underline" title="Underline">U</button> <div class="tb-sep"></div> <button class="tb-btn" data-action="br" title="Line break">↵ Line</button> <button class="tb-btn" data-action="p" title="Paragraph">¶ Para</button> <button class="tb-btn" data-action="hr" title="Horizontal line">―</button> <div class="tb-sep"></div> <button class="tb-btn" data-action="link" title="Add link">🔗 Link</button> <button class="tb-btn" data-action="image" title="Add image">🖼 Img</button> <div class="tb-sep"></div> <button class="tb-btn" data-action="h1" title="Heading 1">H1</button> <button class="tb-btn" data-action="h2" title="Heading 2">H2</button> <button class="tb-btn" data-action="h3" title="Heading 3">H3</button> <div class="tb-sep"></div> <button class="tb-btn" data-action="ul" title="Bullet list">• List</button> <button class="tb-btn" data-action="center" title="Center">⇔</button> <button class="tb-btn" data-action="color" title="Color text">🎨</button> </div> <textarea id="editor" spellcheck="false" placeholder="Write HTML here…&#10;Select text → click toolbar buttons"></textarea> </div> <div class="resizer" id="resizer"></div> <div class="panel panel-preview" id="panel-preview"> <div class="panel-bar"> <span class="panel-title">Preview</span> </div> <iframe id="preview-frame" sandbox="allow-scripts allow-same-origin allow-forms allow-modals" title="Preview"></iframe> <div class="preview-empty" id="preview-empty">Preview appears here</div> </div> </div> <!-- Fullscreen --> <div class="fs-overlay" id="fs-overlay"> <div class="fs-bar"> <div class="logo">Bs<span>DevTol</span> · Full Screen</div> <button class="btn" id="btn-exit-fs">Exit</button> </div> <iframe id="fs-frame" sandbox="allow-scripts allow-same-origin allow-forms allow-modals" title="Fullscreen"></iframe> </div> <!-- Modal --> <div class="modal-backdrop" id="modal"> <div class="modal"> <h3 id="modal-title">Enter value</h3> <p id="modal-desc"></p> <input type="text" id="modal-input" autocomplete="off" /> <div class="modal-actions"> <button class="btn btn-ghost" id="modal-cancel">Cancel</button> <button class="btn btn-blue" id="modal-ok">OK</button> </div> </div> </div>
<script>
    document.addEventListener('contextmenu', e => e.preventDefault());
    const editor = document.getElementById('editor');
    const frame = document.getElementById('preview-frame');
    const fsFrame = document.getElementById('fs-frame');
    const fsOverlay = document.getElementById('fs-overlay');
    const statusText = document.getElementById('status-text');
    const previewEmpty = document.getElementById('preview-empty');
    const resizer = document.getElementById('resizer');
    const panelEditor = document.getElementById('panel-editor');
    const main = document.getElementById('main');
    const modal = document.getElementById('modal');
    const modalTitle = document.getElementById('modal-title');
    const modalDesc = document.getElementById('modal-desc');
    const modalInput = document.getElementById('modal-input');
    const BS_BADGE = `<a style="color:white;text-decoration:none;" href="https://blackswan19.github.io/BS/bs.dev.tol"><div class="madein" style="position:absolute;white-space:nowrap;bottom:0;right:0;background:#2b6cc2;padding:3px;text-transform:capitalize;font-size:13px;">
    made in BsDevTol
</div></a>`;

    const SAMPLE = `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Page</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: #0a0a0a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #f0f0f0;
      position: relative;
      padding: 24px;
    }
    .card {
      background: #111;
      border: 1px solid #222;
      border-radius: 12px;
      padding: 40px;
      text-align: center;
      max-width: 400px;
    }
    h1 { font-size: 1.8rem; margin-bottom: 10px; }
    p { color: #999; line-height: 1.6; margin-bottom: 20px; }
    button {
      background: #2b6cc2;
      color: #fff;
      border: none;
      padding: 10px 24px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
    }
    button:hover { background: #1e5aad; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Hello from BsDevTol</h1>
    <p>Select text and use the toolbar to make it <strong>bold</strong>, add links, line breaks, and more.</p>
    <button onclick="alert('Works!')">Click me</button>
  </div>
</body>
</html>`;

    // Load from localStorage or use sample
    const SAVED_KEY = 'bsdevtol_code';
    const saved = localStorage.getItem(SAVED_KEY);
    editor.value = saved !== null ? saved : SAMPLE;
    updatePreview();

    // Live preview
    let debounceTimer;
    editor.addEventListener('input', () => {
      statusText.textContent = 'Updating…';
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => {
        updatePreview();
        try { localStorage.setItem(SAVED_KEY, editor.value); } catch (e) {}
      }, 150);
    });

    editor.addEventListener('keydown', (e) => {
      if (e.key === 'Tab') {
        e.preventDefault();
        insertAtCursor('  ');
      }
    });

    function updatePreview() {
      const code = editor.value.trim();
      if (!code) {
        frame.srcdoc = '';
        fsFrame.srcdoc = '';
        previewEmpty.classList.add('visible');
        statusText.textContent = 'Empty';
        return;
      }
      previewEmpty.classList.remove('visible');
      frame.srcdoc = code;
      fsFrame.srcdoc = code;
      statusText.textContent = 'Live';
    }

    // Insert / wrap helpers
    function getSelection() {
      return {
        start: editor.selectionStart,
        end: editor.selectionEnd,
        selected: editor.value.substring(editor.selectionStart, editor.selectionEnd)
      };
    }

    function setCursor(pos) {
      editor.focus();
      editor.selectionStart = editor.selectionEnd = pos;
    }

    function insertAtCursor(text) {
      const { start, end } = getSelection();
      editor.value = editor.value.substring(0, start) + text + editor.value.substring(end);
      setCursor(start + text.length);
      editor.dispatchEvent(new Event('input'));
    }

    function wrapSelection(before, after, placeholder) {
      const { start, end, selected } = getSelection();
      const text = selected || placeholder || '';
      const result = before + text + after;
      editor.value = editor.value.substring(0, start) + result + editor.value.substring(end);
      if (selected) {
        editor.focus();
        editor.selectionStart = start + before.length;
        editor.selectionEnd = start + before.length + text.length;
      } else {
        setCursor(start + before.length + text.length);
      }
      editor.dispatchEvent(new Event('input'));
    }

    // Modal
    let modalResolve = null;

    function askUser(title, desc, defaultValue = '') {
      return new Promise((resolve) => {
        modalResolve = resolve;
        modalTitle.textContent = title;
        modalDesc.textContent = desc;
        modalInput.value = defaultValue;
        modal.classList.add('open');
        setTimeout(() => { modalInput.focus(); modalInput.select(); }, 40);
      });
    }

    function closeModal(value) {
      modal.classList.remove('open');
      if (modalResolve) { modalResolve(value); modalResolve = null; }
    }

    document.getElementById('modal-ok').addEventListener('click', () => closeModal(modalInput.value.trim()));
    document.getElementById('modal-cancel').addEventListener('click', () => closeModal(null));
    modalInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') closeModal(modalInput.value.trim());
      if (e.key === 'Escape') closeModal(null);
    });
    modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(null); });

    // Toolbar
    document.getElementById('toolbar').addEventListener('click', async (e) => {
      const btn = e.target.closest('[data-action]');
      if (!btn) return;
      const action = btn.dataset.action;
      editor.focus();

      switch (action) {
        case 'bold': wrapSelection('<strong>', '</strong>', 'bold text'); break;
        case 'italic': wrapSelection('<em>', '</em>', 'italic text'); break;
        case 'underline': wrapSelection('<u>', '</u>', 'underlined'); break;
        case 'br': insertAtCursor('<br>\n'); break;
        case 'p': wrapSelection('<p>', '</p>', 'Paragraph text'); break;
        case 'hr': insertAtCursor('\n<hr>\n'); break;
        case 'h1': wrapSelection('<h1>', '</h1>', 'Heading'); break;
        case 'h2': wrapSelection('<h2>', '</h2>', 'Heading'); break;
        case 'h3': wrapSelection('<h3>', '</h3>', 'Heading'); break;
        case 'ul': insertAtCursor('<ul>\n  <li>Item 1</li>\n  <li>Item 2</li>\n  <li>Item 3</li>\n</ul>\n'); break;
        case 'center': wrapSelection('<div style="text-align:center">', '</div>', 'Centered text'); break;
        case 'link': {
          const url = await askUser('Add Link', 'Paste the URL', 'https://');
          if (url === null) break;
          wrapSelection('<a href="' + (url || 'https://example.com') + '" target="_blank">', '</a>', 'click here');
          break;
        }
        case 'image': {
          const src = await askUser('Add Image', 'Paste the image URL', 'https://');
          if (src === null) break;
          insertAtCursor('<img src="' + (src || 'https://via.placeholder.com/300x200') + '" alt="image" style="max-width:100%;height:auto;">\n');
          break;
        }
        case 'color': {
          const color = await askUser('Text Color', 'Color name or code (red, #ff5500)', 'red');
          if (color === null) break;
          wrapSelection('<span style="color:' + (color || 'red') + '">', '</span>', 'colored text');
          break;
        }
      }
    });

    // Inject watermark badge
    function injectBadge(html) {
      if (html.includes('made in BsDevTol') || html.includes('blackswan19.github.io/BS/bs.dev.tol')) {
        return html;
      }
      const lower = html.toLowerCase();
      const bodyClose = lower.lastIndexOf('</body>');
      if (bodyClose !== -1) {
        return html.slice(0, bodyClose) + '\n' + BS_BADGE + '\n' + html.slice(bodyClose);
      }
      return html + '\n' + BS_BADGE + '\n';
    }

    // Download (with watermark)
    document.getElementById('btn-download').addEventListener('click', () => {
      let code = editor.value.trim();
      if (!code) { alert('Write some HTML first.'); return; }
      code = injectBadge(code);
      const blob = new Blob([code], { type: 'text/html;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'index.html';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      flashBtn('btn-download', 'Downloaded!');
    });

    // Copy (with watermark)
    document.getElementById('btn-copy').addEventListener('click', async () => {
      let code = editor.value.trim();
      if (!code) { alert('Nothing to copy.'); return; }
      code = injectBadge(code);
      try {
        await navigator.clipboard.writeText(code);
        flashBtn('btn-copy', 'Copied!');
      } catch (err) {
        alert('Could not copy');
      }
    });

    function flashBtn(id, text) {
      const btn = document.getElementById(id);
      const original = btn.innerHTML;
      btn.innerHTML = text;
      setTimeout(() => { btn.innerHTML = original; }, 1400);
    }

    // Fullscreen
    document.getElementById('btn-fullscreen').addEventListener('click', () => {
      fsFrame.srcdoc = editor.value;
      fsOverlay.classList.add('active');
    });
    document.getElementById('btn-exit-fs').addEventListener('click', () => {
      fsOverlay.classList.remove('active');
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && fsOverlay.classList.contains('active')) {
        fsOverlay.classList.remove('active');
      }
    });

    // Reset
    document.getElementById('btn-reset').addEventListener('click', () => {
      if (confirm('Reset to sample?')) {
        editor.value = SAMPLE;
        try { localStorage.setItem(SAVED_KEY, SAMPLE); } catch (e) {}
        updatePreview();
      }
    });

    // Resizer
    let isDragging = false;
    resizer.addEventListener('mousedown', () => {
      isDragging = true;
      resizer.classList.add('dragging');
      document.body.style.cursor = 'col-resize';
      document.body.style.userSelect = 'none';
    });
    document.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const rect = main.getBoundingClientRect();
      const percent = ((e.clientX - rect.left) / rect.width) * 100;
      if (percent > 20 && percent < 80) {
        panelEditor.style.flex = `0 0 ${percent}%`;
      }
    });
    document.addEventListener('mouseup', () => {
      if (isDragging) {
        isDragging = false;
        resizer.classList.remove('dragging');
        document.body.style.cursor = '';
        document.body.style.userSelect = '';
      }
    });
  </script>
</body>
</html>
